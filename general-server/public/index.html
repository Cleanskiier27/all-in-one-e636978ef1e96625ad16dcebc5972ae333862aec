<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaVPN Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AlphaVPN secure control</p>
          <h1>AlphaVPN Dashboard</h1>
        </div>
        <div class="status-pill" id="serviceStatus">Loading…</div>
      </header>

      <main class="dashboard-grid">
        <section class="card highlight">
          <div class="card-label">Tunnel state</div>
          <div class="stat-value" id="serviceValue">Checking…</div>
          <div class="stat-meta" id="serviceMeta">Loading tunnel details…</div>
        </section>

        <section class="card">
          <div class="card-label">Sessions logged</div>
          <div class="stat-value" id="messageCount">0</div>
          <div class="stat-meta" id="lastUpdated">Waiting for data…</div>
        </section>

        <section class="card wide">
          <div class="card-label">Latest activity</div>
          <div class="stat-value small" id="latestMessage">No activity yet</div>
        </section>
      </main>

      <section class="composer card">
        <h2>Log an AlphaVPN event</h2>
        <form id="messageForm">
          <div class="field-row">
            <label>
              <span>Operator</span>
              <input id="author" name="author" type="text" placeholder="Jane Doe" required />
            </label>
            <label>
              <span>Event details</span>
              <textarea id="message" name="message" rows="3" placeholder="Describe the VPN activity or alert." required></textarea>
            </label>
          </div>
          <button type="submit">Save event</button>
        </form>
      </section>

      <section class="card list-card">
        <div class="list-header">
          <h2>Recent activity</h2>
          <button type="button" class="secondary-button" id="refreshButton">Refresh now</button>
        </div>
        <ul id="messageList" class="message-list"></ul>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
